# Goes into the http block of the image's own nginx.conf.
#
# Each proxy adds what it saw to these headers rather than replacing them, and the app reads the
# one TRUSTED_PROXY_COUNT places from the end. So a value a visitor makes up is never the one used.
map $http_x_forwarded_proto $forwarded_proto_chain {
    ""      $scheme;
    default "$http_x_forwarded_proto, $scheme";
}

map $http_x_forwarded_host $forwarded_host_chain {
    ""      $http_host;
    default "$http_x_forwarded_host, $http_host";
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # The same limit as MAX_CONTENT_LENGTH in the app: there are no uploads, only forms.
    client_max_body_size 1m;

    # Every request is already logged by the app, and this saves wear on an SD card.
    access_log off;

    # Docker's own DNS. Looking the app up each time, rather than once at startup, is what lets the
    # app's container be replaced in a deploy without Nginx carrying on at its old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed filenames: when a file changes, so does its name. So it can be cached forever.
    location /static/dist/ {
        try_files $uri =404;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Nothing outside the built files is served, including through the app.
    location /static/ {
        return 404;
    }

    # For the container's health check. It says nothing about the app, and reveals nothing.
    location = /nginx-ok {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Shown for the moment the app isn't there, such as during a restart.
    location = /down.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        set $app http://web:8000;
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_chain;
        proxy_set_header X-Forwarded-Host $forwarded_host_chain;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # A large download goes straight through, rather than filling the small /tmp.
        proxy_max_temp_file_size 0;

        # The app's own error pages pass through. These are only for when it can't be reached.
        error_page 502 503 504 /down.html;
    }
}
