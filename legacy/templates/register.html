{% extends "base.html" %}

{% block title %}Create account - SellTrack{% endblock %}

{% block content %}

<div class="box auth-box">
    <h2>Create an account</h2>
    <p class="hint">Your sales, products and profit split are saved to your account, so you can log back in any time.</p>
    <form method="POST" action="/register">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" value="{{ username }}"
               minlength="3" maxlength="30" autofocus required>

        <label for="password">Password <span class="hint">(at least 6 characters)</span></label>
        <input type="password" name="password" id="password" minlength="6" required>

        <label for="confirm">Confirm password</label>
        <input type="password" name="confirm" id="confirm" minlength="6" required>

        <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="/login">Log in</a></p>
</div>

{% endblock %}
