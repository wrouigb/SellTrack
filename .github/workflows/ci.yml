# Runs on every pull request and every push to main. A release only happens if this passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes an older run pointless, which saves minutes on a free plan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and scans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks looks through the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: scripts/ci_step.sh make lint
      - run: scripts/ci_step.sh make types
      - run: scripts/ci_step.sh make audit
      - name: Look for secrets in the history
        run: >-
          scripts/ci_step.sh docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --redact --no-banner
          --config=/repo/.gitleaks.toml
      - name: Check the shell scripts
        run: scripts/ci_step.sh uvx --from shellcheck-py shellcheck deploy/*.sh tests/*.sh scripts/*.sh
      - name: Check the Dockerfile
        run: scripts/ci_step.sh uvx --from hadolint-bin hadolint Dockerfile
      - name: Check the workflows
        run: scripts/ci_step.sh uvx --from actionlint-py actionlint
      - name: Check the compose files
        run: scripts/ci_step.sh sh -c "make prod-config && docker compose config --quiet"

  tests:
    # This is the plan's definition of done for phase 6, run exactly as the README says.
    name: make setup, make test, docker compose up
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: scripts/ci_step.sh make setup
      - name: Install what the browser needs
        run: scripts/ci_step.sh uv run playwright install-deps chromium
      - run: scripts/ci_step.sh make test
      - name: Run the local stack
        run: scripts/ci_step.sh tests/local_stack_check.sh

  stack:
    # The production compose file with the real images, exactly as a deploy runs it.
    name: Production stack, deploys, backup and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_REPO: selltrack-ci
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: selltrack-ci:ci
          build-args: REVISION=${{ github.sha }}
      - name: Build the Nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: nginx
          load: true
          tags: selltrack-ci-nginx:ci
          build-args: REVISION=${{ github.sha }}
      - name: Check the running stack
        run: scripts/ci_step.sh tests/stack_check.sh
      - name: Check the deploy script, and that a bad release goes back by itself
        run: scripts/ci_step.sh tests/deploy_check.sh
      # Only our own images. There's nothing we could do about a finding in Postgres's or Redis's,
      # apart from waiting for their next release.
      - name: Look for known vulnerabilities in the images
        run: |
          status=0
          for image in selltrack-ci:ci selltrack-ci-nginx:ci; do
            scripts/ci_step.sh docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln \
              "$image" || status=1
          done
          exit "$status"

  arm64:
    # A Raspberry Pi image that doesn't build would otherwise only show up after merging.
    name: Build for Raspberry Pi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/arm64
          build-args: REVISION=${{ github.sha }}
      - name: Build the Nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: nginx
          platforms: linux/arm64
          build-args: REVISION=${{ github.sha }}
