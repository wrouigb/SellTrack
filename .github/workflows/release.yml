# After CI passes on main: build for PC and Raspberry Pi, push, and move the staging tag.
# Staging then updates itself. Production only moves when you run the Promote workflow.
name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/wrouigb/selltrack

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Exactly what CI tested, even if something newer has been merged since.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.REVISION }}
          build-args: REVISION=${{ env.REVISION }}
      - name: Build and push Nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-nginx:sha-${{ env.REVISION }}
          build-args: REVISION=${{ env.REVISION }}
      # Last, and the app's tag after Nginx's, because moving that is what a deploy looks for. By
      # then both images exist.
      - name: Move the staging tag
        run: |
          docker buildx imagetools create --tag "$IMAGE-nginx:staging" "$IMAGE-nginx:sha-$REVISION"
          docker buildx imagetools create --tag "$IMAGE:staging" "$IMAGE:sha-$REVISION"
