[project]
name = "selltrack"
version = "0.1.0"
description = "Track what you sell, see what you make, and split the profit."
readme = "README.md"
requires-python = ">=3.12"
# Lower bounds only. Exact, hashed versions are pinned in uv.lock (generated with `uv lock`).
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.1",
    "flask-migrate>=4.1",
    "psycopg[binary]>=3.3",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3",
    "argon2-cffi>=25.1",
    "flask-limiter>=4.1",
    "redis>=8.0",
    "flask-caching>=2.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "gunicorn>=26.0",
    "sentry-sdk[flask]>=2.73",
    "tzdata>=2025.1",  # slim container images ship no time zone database
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "factory-boy>=3.3",
    "playwright>=1.64",
    "ruff>=0.17",
    "mypy>=2.0",
    "pre-commit>=4.7",
    "pip-audit>=2.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "integration: needs real Postgres and Redis (TEST_DATABASE_URL, TEST_REDIS_URL)",
    "e2e: browser tests, which also need built assets (npm run build) and Chromium",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # modern syntax
    "S",             # security (bandit rules)
    "SIM", "C4",     # simplifications
    "N",             # naming
    "PT",            # pytest style
    "DTZ",           # timezone-aware datetimes
    "RUF",
]

# The minus sign and multiplication sign are deliberate: they are how amounts and
# formulas are displayed to users.
allowed-confusables = ["\u2212", "\u00d7"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; random and throwaway passwords are fine in test data
"tests/**" = ["S101", "S105", "S106", "S311"]
# Field names and labels that merely contain the word "password".
"app/security/rate_limits.py" = ["S105"]
"app/services/auth.py" = ["S106"]
"app/services/notifications.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^migrations/"]

# These ship without type information.
[[tool.mypy.overrides]]
module = ["flask_login.*", "flask_migrate.*", "flask_wtf.*", "wtforms.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.forms.*"]
disallow_subclassing_any = false
